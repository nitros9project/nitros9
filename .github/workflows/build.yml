name: Build

on:
  schedule:
    # GitHub schedules use UTC; run the default branch (main) nightly.
    - cron: '17 9 * * *'
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      suite:
        description: Additional tests (quick checks always run)
        required: true
        default: full
        type: choice
        options: [quick, full, mame, filesystems, all]
      game:
        description: Game to boot with the MAME suite
        required: true
        default: rogue
        type: string

permissions:
  contents: read

# Superseded commits on a branch do not consume more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANGUAGES: ${{ github.workspace }}/nitros9-languages
  NITROS9_GAMES_DIR: ${{ github.workspace }}/nitros9-games
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up tools
      uses: ./.github/actions/setup-tools

    - name: Test representative system modules and regression checks
      run: bash scripts/ci-quick.sh

  build:
    name: Full build
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'all'))
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Checkout NitrOS-9 games main
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-games
        ref: main
        path: nitros9-games

    - name: Checkout NitrOS-9 languages
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-languages
        path: nitros9-languages

    - name: Set up tools
      uses: ./.github/actions/setup-tools

    - name: Build NitrOS-9
      run: bash .github/workflows/nitros9.sh

  prepare-mame:
    name: Prepare pinned MAME
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'mame' || inputs.suite == 'filesystems' || inputs.suite == 'all'))
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Restore or download verified ROMs once
      uses: ./.github/actions/setup-mame-roms
    - name: Share verified ROMs with this run
      uses: actions/upload-artifact@v6
      with:
        name: verified-mame-roms
        path: ${{ runner.temp }}/roms/*.zip
        retention-days: 1
        if-no-files-found: error
    - name: Build and cache pinned MAME once for all emulator jobs
      uses: ./.github/actions/setup-mame

  mame-smoke:
    name: MAME smoke tests
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'mame' || inputs.suite == 'all'))
    needs: [quick, prepare-mame]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Checkout NitrOS-9 games main
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-games
        ref: main
        path: nitros9-games

    - name: Checkout NitrOS-9 languages
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-languages
        path: nitros9-languages

    - name: Set up tools
      uses: ./.github/actions/setup-tools

    - name: Set up pinned MAME
      uses: ./.github/actions/setup-mame

    - name: Set up verified ROMs
      id: roms
      uses: ./.github/actions/restore-mame-roms

    - name: Boot 6809 floppy
      run: xvfb-run -a bash scripts/mame-boot-smoke.sh 6809 "$RUNNER_TEMP/roms" "$RUNNER_TEMP/mame-results/6809"

    - name: Boot 6309 floppy
      if: ${{ !cancelled() && steps.roms.outcome == 'success' }}
      run: xvfb-run -a bash scripts/mame-boot-smoke.sh 6309 "$RUNNER_TEMP/roms" "$RUNNER_TEMP/mame-results/6309"

    - name: Boot selected game on both CPUs
      env:
        GAME_TO_TEST: ${{ inputs.game || 'rogue' }}
      run: |
        for cpu in 6809 6309; do
          xvfb-run -a make -C recipes/coco3/games GAME="$GAME_TO_TEST" CPU="$cpu" \
            MAME_ROM_PATH="$RUNNER_TEMP/roms" check
        done

    - name: Upload game diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: game-boot-results
        include-hidden-files: true
        path: |
          recipes/coco3/games/.build/**/verification/
          recipes/coco3/games/.build/**/revisions.txt
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload boot diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: mame-boot-results
        path: ${{ runner.temp }}/mame-results
        retention-days: 7
        if-no-files-found: ignore

  filesystem-cpu:
    name: Filesystem CPU regressions
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'filesystems' || inputs.suite == 'all'))
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up tools
      uses: ./.github/actions/setup-tools
    - name: Set up filesystem test Python
      uses: ./.github/actions/setup-filesystem-tests
    - name: Install independent FAT checker
      run: bash scripts/setup-ci-mame.sh dosfstools
    - name: Run all assembled filesystem regressions and seeded stress tests
      run: bash scripts/ci-filesystems.sh "$RUNNER_TEMP/filesystem-cpu"
    - name: Upload CPU regression diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: filesystem-cpu-results
        path: ${{ runner.temp }}/filesystem-cpu
        retention-days: 14
        if-no-files-found: ignore

  filesystem-mame:
    name: Filesystem integration (${{ matrix.suite }}-${{ matrix.platform }})
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'filesystems' || inputs.suite == 'all'))
    needs: [quick, prepare-mame]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [pcf-write, pcf-readonly, pcf-floppy, pcf-boot, rbf, rfm, rfm-irq]
        platform: [l1-coco, l1-coco2b, l2-6809, l2-6309]
        include:
          - suite: module-groups
            platform: l2-6809
          - suite: module-groups
            platform: l2-6309
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Checkout NitrOS-9 languages
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-languages
        path: nitros9-languages
    - name: Set up tools
      uses: ./.github/actions/setup-tools
    - name: Set up filesystem test Python
      uses: ./.github/actions/setup-filesystem-tests
    - name: Set up pinned MAME
      uses: ./.github/actions/setup-mame
    - name: Set up verified ROMs
      uses: ./.github/actions/restore-mame-roms
    - name: Run existing filesystem integration suite
      env:
        FILESYSTEM_SUITE: ${{ matrix.suite }}
        FILESYSTEM_PLATFORM: ${{ matrix.platform }}
        MAME_ROMPATH: ${{ runner.temp }}/roms
      run: |
        set -o pipefail
        mkdir -p "$RUNNER_TEMP/filesystem-integration"
        xvfb-run -a bash scripts/ci-filesystems-mame.sh "$FILESYSTEM_SUITE" \
          2>&1 | tee "$RUNNER_TEMP/filesystem-integration/run.log"
    - name: Upload filesystem integration diagnostics
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: filesystem-${{ matrix.suite }}-${{ matrix.platform }}-results
        include-hidden-files: true
        path: |
          ${{ runner.temp }}/filesystem-integration/
          recipes/coco3/pcf_write_mame_test/.fat-root/
          recipes/coco3/pcf_write_mame_test/.random-cpu/
          recipes/coco3/fat_root_mame_test/.fat-root/
          recipes/coco3/fat_mame_test/.fat-test/
          recipes/coco3/fat_boot_mame_test/.fat-test/
          recipes/coco3/rbf_mame_test/.rbf-test/
          recipes/coco3/module_group_mame_test/.group-test/
          recipes/coco3/rfm_mame_test/.rfm-test/
        retention-days: 14
        if-no-files-found: ignore

  level1-mame:
    name: Level One runtime (${{ matrix.machine }})
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'filesystems' || inputs.suite == 'all'))
    needs: [quick, prepare-mame]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        machine: [coco, coco2b]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-languages
        path: nitros9-languages
    - uses: ./.github/actions/setup-tools
    - uses: ./.github/actions/setup-mame
    - uses: ./.github/actions/restore-mame-roms
    - name: Boot Level One and verify RBF operations
      env:
        MAME_MACHINE: ${{ matrix.machine }}
        MAME_ROMPATH: ${{ runner.temp }}/roms
      run: xvfb-run -a make -C recipes/coco/l1_mame_test MAME_MACHINE="$MAME_MACHINE" MAME_ROMPATH="$MAME_ROMPATH" check
    - name: Upload Level One evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: level1-${{ matrix.machine }}-results
        include-hidden-files: true
        path: recipes/coco/l1_mame_test/.l1-test/
        retention-days: 14
        if-no-files-found: ignore

  test-report:
    name: Test evidence report
    if: ${{ always() && ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.suite != 'quick')) }}
    needs: [quick, build, prepare-mame, mame-smoke, filesystem-cpu, filesystem-mame, level1-mame]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Download test evidence
      continue-on-error: true
      uses: actions/download-artifact@v7
      with:
        path: ${{ runner.temp }}/test-artifacts
        pattern: "*-results"
    - name: Collect run and job metadata
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/test-run.json"
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/test-jobs.json"
    - name: Set up PDF report dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/report-venv"
        "$RUNNER_TEMP/report-venv/bin/pip" install -r scripts/requirements-test-report.txt
    - name: Test PDF output and links
      run: '"$RUNNER_TEMP/report-venv/bin/python" -m unittest discover -s scripts -p test_ci_test_report_pdf.py -v'
    - name: Build readable evidence report
      run: |
        "$RUNNER_TEMP/report-venv/bin/python" scripts/ci-test-report.py \
          --artifacts "$RUNNER_TEMP/test-artifacts" \
          --run-json "$RUNNER_TEMP/test-run.json" \
          --jobs-json "$RUNNER_TEMP/test-jobs.json" \
          --output "$RUNNER_TEMP/test-report"
        "$RUNNER_TEMP/report-venv/bin/python" scripts/ci-test-report-pdf.py --report "$RUNNER_TEMP/test-report"
    - name: Upload test evidence report
      id: html
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-evidence-report
        include-hidden-files: true
        path: ${{ runner.temp }}/test-report/
        retention-days: 14
        if-no-files-found: error
    - name: Upload PDF report
      id: pdf
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: test-report-pdf
        path: ${{ runner.temp }}/test-report/test-report.pdf
        retention-days: 14
        if-no-files-found: error
    - name: Surface report downloads
      if: always()
      env:
        PDF_URL: ${{ steps.pdf.outputs.artifact-url }}
        HTML_URL: ${{ steps.html.outputs.artifact-url }}
      run: |
        printf '# Read the test report\n\n' >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$PDF_URL" ]; then
          printf '**[Download the PDF report (ZIP)](%s)**\n\n' "$PDF_URL" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -n "$HTML_URL" ]; then
          printf '[Download HTML and raw evidence (ZIP)](%s)\n\n' "$HTML_URL" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "$RUNNER_TEMP/test-report/summary.md" ]; then
          cat "$RUNNER_TEMP/test-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
