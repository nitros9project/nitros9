name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Additional tests (quick checks always run)
        required: true
        default: full
        type: choice
        options: [quick, full, mame, all]
      game:
        description: Game to boot with the MAME suite
        required: true
        default: rogue
        type: string

permissions:
  contents: read

# Superseded commits on a branch do not consume more runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANGUAGES: ${{ github.workspace }}/nitros9-languages
  NITROS9_GAMES_DIR: ${{ github.workspace }}/nitros9-games
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  quick:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Checked on branch push' || 'Quick checks' }}
    # Give the skipped notice a distinct name so it cannot mask a failed push check.
    # Internal branches are checked on push; fork PRs need their own run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up tools
      uses: ./.github/actions/setup-tools

    - name: Test representative system modules and regression checks
      run: bash scripts/ci-quick.sh

  build:
    name: Full build
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'all')
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Checkout NitrOS-9 games main
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-games
        ref: main
        path: nitros9-games

    - name: Checkout NitrOS-9 languages
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-languages
        path: nitros9-languages

    - name: Set up tools
      uses: ./.github/actions/setup-tools

    - name: Build NitrOS-9
      run: bash .github/workflows/nitros9.sh

  mame-smoke:
    name: MAME smoke tests
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'mame' || inputs.suite == 'all')
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Checkout NitrOS-9 games main
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-games
        ref: main
        path: nitros9-games

    - name: Checkout NitrOS-9 languages
      uses: actions/checkout@v5
      with:
        repository: nitros9project/nitros9-languages
        path: nitros9-languages

    - name: Set up tools
      uses: ./.github/actions/setup-tools

    - name: Install MAME and virtual display
      run: |
        sudo apt-get update
        sudo apt-get install -y mame xvfb xauth
        echo "/usr/games" >> "$GITHUB_PATH"

    - name: Download and verify ROM archives
      run: |
        mkdir -p "$RUNNER_TEMP/roms"
        cd "$RUNNER_TEMP/roms"
        for archive in coco3 coco3h coco_fdc; do
          curl --fail --location --retry 3 --max-time 60 \
            "https://colorcomputerarchive.com/repo/ROMs/MAME-MESS/$archive.zip" -o "$archive.zip"
        done
        sha256sum --check <<'HASHES'
        a7e35287874ca75f119ae1aeb565eb5edf4049f3fa733a68c4142b58f2d17c42  coco3.zip
        04b1c352aa16eada6889b80d07d8625bdc7d3d79c77dd229eafb10b878d90c91  coco3h.zip
        d1607d1478123b61f0debbc835bb8497e236872cde406978141beb1c9c729efa  coco_fdc.zip
        HASHES

    - name: Boot 6809 floppy
      run: xvfb-run -a bash scripts/mame-boot-smoke.sh 6809 "$RUNNER_TEMP/roms" "$RUNNER_TEMP/mame-results/6809"

    - name: Boot 6309 floppy
      if: ${{ !cancelled() }}
      run: xvfb-run -a bash scripts/mame-boot-smoke.sh 6309 "$RUNNER_TEMP/roms" "$RUNNER_TEMP/mame-results/6309"

    - name: Boot selected game on both CPUs
      env:
        GAME_TO_TEST: ${{ inputs.game }}
      run: |
        for cpu in 6809 6309; do
          xvfb-run -a make -C recipes/coco3/games GAME="$GAME_TO_TEST" CPU="$cpu" \
            MAME_ROM_PATH="$RUNNER_TEMP/roms" check
        done

    - name: Upload game diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: game-boot-results
        include-hidden-files: true
        path: |
          recipes/coco3/games/.build/**/verification/
          recipes/coco3/games/.build/**/revisions.txt
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload boot diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mame-boot-results
        path: ${{ runner.temp }}/mame-results
        retention-days: 7
        if-no-files-found: ignore
