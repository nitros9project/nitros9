name: Restore and verify CoCo MAME ROM archives
description: Restore and verify CoCo MAME ROM archives
runs:
  using: composite
  steps:
    - name: Cache ROM archives
      id: rom-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/roms
        key: mame-coco-roms-a7e35287874c-04b1c352aa16-d1607d147812-l1-v1

    - name: Download and verify ROM archives
      id: roms
      shell: bash
      run: |
        bash scripts/setup-mame-roms.sh "$RUNNER_TEMP/roms"

    - name: Save verified ROM archives
      if: steps.rom-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/roms
        key: mame-coco-roms-a7e35287874c-04b1c352aa16-d1607d147812-l1-v1
